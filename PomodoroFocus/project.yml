name: PomodoroFocus
options:
  bundleIdPrefix: com.pomodorofocus
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PomodoroFocus:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    resources:
      - path: iOS/Resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pomodoro Focus
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        WKCompanionAppBundleIdentifier: com.pomodorofocus.PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomodorofocus.PomodoroFocus
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: PomodoroFocusWatch

  PomodoroFocusWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    resources:
      - path: Watch/Resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pomodoro
        WKApplication: true
        WKWatchOnly: false
        WKCompanionAppBundleIdentifier: com.pomodorofocus.PomodoroFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pomodorofocus.PomodoroFocus.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
